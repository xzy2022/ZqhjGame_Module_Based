[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-hf2026"
version = "0.1.0"
description = "红枫 2026 赛题二个人协同识别算法与实验工具"
requires-python = ">=3.10"
dependencies = [
    "redis>=5,<7",
    "psutil>=5.9,<8",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
vision = [
    "torch>=2.6,<3",
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

